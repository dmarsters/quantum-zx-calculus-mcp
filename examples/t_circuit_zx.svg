<rect x="331.0" y="95.0" width="90.0" height="90.0" fill="#ffd54f" stroke="#f9a825" stroke-width="2" />
<text x="376" y="146" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">H</text>
<text x="376" y="188" font-size="9" text-anchor="middle" fill="#666">h</text>
<circle cx="524" cy="140" r="30" fill="#4caf50" stroke="#2e7d32" stroke-width="2" />
