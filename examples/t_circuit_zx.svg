<text x="75" y="454" font-size="10" fill="#333">Z-spider</text>
<circle cx="200" cy="450" r="15" fill="#f44336" stroke="#c62828" stroke-width="1.5" />
<text x="200" y="454" font-size="10" font-weight="bold" text-anchor="middle" fill="white">X</text>
<text x="225" y="454" font-size="10" fill="#333">X-spider</text>
<rect x="335" y="435" width="30" height="30" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5" />
<text x="350" y="454" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">H</text>
<text x="375" y="454" font-size="10" fill="#333">Hadamard</text>
