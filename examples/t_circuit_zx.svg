<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" style="font-family: 'SF Mono', Monaco, monospace; background: white;">
<text x="450.0" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">ZX-Diagram Visualization</text>
<g id="wires">
<line x1="80" y1="140" x2="376" y2="140" stroke="#666" stroke-width="2" />
<line x1="376" y1="140" x2="524" y2="140" stroke="#666" stroke-width="2" />
<line x1="524" y1="140" x2="672" y2="140" stroke="#666" stroke-width="2" />
