<text x="672" y="188" font-size="9" text-anchor="middle" fill="#666">cx</text>
<circle cx="80" cy="420" r="30" fill="#4caf50" stroke="#2e7d32" stroke-width="2" />
<text x="80" y="426" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Z</text>
<text x="80" y="382" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">0.25π</text>
<text x="80" y="468" font-size="9" text-anchor="middle" fill="#666">t</text>
</g>
<g id="legend">
