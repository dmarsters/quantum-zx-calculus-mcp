<text x="524" y="102" font-size="11" text-anchor="middle" fill="#333" font-weight="bold">0.25π</text>
<text x="524" y="188" font-size="9" text-anchor="middle" fill="#666">t</text>
<circle cx="672" cy="140" r="30" fill="#4caf50" stroke="#2e7d32" stroke-width="2" />
