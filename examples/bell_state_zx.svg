<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="font-family: 'SF Mono', Monaco, monospace; background: white;">
<text x="400.0" y="30" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">ZX-Diagram Visualization</text>
<g id="wires">
<line x1="80" y1="140" x2="506" y2="140" stroke="#666" stroke-width="2" />
<line x1="506" y1="140" x2="80" y2="320" stroke="#666" stroke-width="2" />
<line x1="293" y1="140" x2="80" y2="320" stroke="#666" stroke-width="2" />
</g>
<g id="spiders">
<circle cx="80" cy="140" r="25" fill="#4caf50" stroke="#2e7d32" stroke-width="2" />
<text x="80" y="146" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Z</text>
<text x="80" y="183" font-size="9" text-anchor="middle" fill="#666">q0_init</text>
<circle cx="293" cy="140" r="25" fill="#4caf50" stroke="#2e7d32" stroke-width="2" />
<text x="293" y="146" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Z</text>
<text x="293" y="183" font-size="9" text-anchor="middle" fill="#666">q1_init</text>
<rect x="468.5" y="102.5" width="75.0" height="75.0" fill="#ffd54f" stroke="#f9a825" stroke-width="2" />
<text x="506" y="146" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">H</text>
<text x="506" y="183" font-size="9" text-anchor="middle" fill="#666">h</text>
<circle cx="80" cy="320" r="25" fill="#4caf50" stroke="#2e7d32" stroke-width="2" />
<text x="80" y="326" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Z</text>
<text x="80" y="363" font-size="9" text-anchor="middle" fill="#666">cx</text>
</g>
<g id="legend">
<circle cx="50" cy="350" r="12" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5" />
<text x="50" y="354" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Z</text>
<text x="75" y="354" font-size="10" fill="#333">Z-spider</text>
<circle cx="200" cy="350" r="12" fill="#f44336" stroke="#c62828" stroke-width="1.5" />
<text x="200" y="354" font-size="10" font-weight="bold" text-anchor="middle" fill="white">X</text>
<text x="225" y="354" font-size="10" fill="#333">X-spider</text>
<rect x="338" y="338" width="24" height="24" fill="#ffd54f" stroke="#f9a825" stroke-width="1.5" />
<text x="350" y="354" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">H</text>
<text x="375" y="354" font-size="10" fill="#333">Hadamard</text>
</g>
</svg>